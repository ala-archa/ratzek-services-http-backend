# Canonical copy of /etc/sysctl.d/90-ratzek-forensics.conf on ratzek (the Pi).
# Deployed BY HAND: scp here -> /etc/sysctl.d/, then `sysctl --system`. Ansible does not manage
# this host's sysctl (see doc/dhcp-migration-runbook.md for why the ansible tree is stale).
#
# Purpose: make the kernel *say something* while the box is dying. On 2026-08-30 the rootfs on the
# USB-SSD wedged for 45h while the kernel kept forwarding traffic, and not one diagnostic line
# survived — journald writes to the very disk that stopped answering. These settings only pay off
# together with netconsole (doc/netconsole.service), which carries kmsg off the host over UDP.

# Report a task stuck in uninterruptible sleep after 60s instead of 120s. The wedge we are hunting
# parks jbd2/sda2-8, kworker/flush and uas_eh_abort_handler in D state; their stack traces are the
# evidence that says whether UAS is at fault at all.
kernel.hung_task_timeout_secs = 60

# The default of 10 warnings is a single incident's worth: the counter is global and never resets,
# so after the first wedge the kernel goes quiet forever. 100 keeps it talking across several.
kernel.hung_task_warnings = 100

# Turn an oops into a panic, and make a panic reboot instead of hanging forever (default 0 = hang).
# A hung panic on a site with no physical access and no remote power control is an outage until
# somebody drives up; a reboot is a minute.
kernel.panic_on_oops = 1
kernel.panic = 10

# DELIBERATELY NOT SET: kernel.hung_task_panic. With the value above it would turn *any* 60-second
# D-state into a panic, and slow I/O on this bridge is routine — that is a reboot loop, not a fix.
