# Deployed by hand to /etc/ssh/sshd_config.d/10-ratzek-no-password.conf
# (sshd_config has `Include /etc/ssh/sshd_config.d/*.conf` at the top, so this wins).
#
# The host's port 22 is forwarded from the public VPS (port 5000) and gets ~850
# root-password guesses per hour (2026-09-13). Every human login uses a key
# (/root/.ssh/authorized_keys); passwords buy nothing but a brute-force surface
# and hundreds of sshd/pam forks per minute. KbdInteractive is disabled too:
# with UsePAM it would still accept passwords through PAM.
PasswordAuthentication no
KbdInteractiveAuthentication no
