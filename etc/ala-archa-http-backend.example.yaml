---

log_level: Info

ipset_shaper_name: shaper
ipset_acl_name: acl
http_listen: 0.0.0.0:8888
bytes_unlimited_limit: 5000000

ping:
  server: 1.1.1.1
  crontab: "0 * * * * *"
speedtest:
  speedtest_cli_path: /usr/local/bin/speedtest
  crontab: "0 15 */8 * * *"

# dnsmasq lease file (the backend reads this to know who holds which IP).
dhcpd_leases: /var/lib/misc/dnsmasq.leases

# Lease length in seconds — used to approximate `last_seen` (dnsmasq's lease file
# lacks a client-last-transaction timestamp). Match the server's lease time.
# dhcp_lease_secs: 43200

persistent_state_path: /var/tmp/ala-archa-http-backend.state

# Admin panel credentials (optional). Generate password_hash with:
#   ala-archa-http-backend hash-password 'your-password'
# Keep this config readable only by its owner (mode 0600).
# admin:
#   login: admin
#   password_hash: "$argon2id$v=19$m=19456,t=2,p=1$c29tZXNhbHQ$..."
#   # Set Secure flag on the session cookie. Keep true in production (TLS).
#   # Set false only for local http testing.
#   cookie_secure: true

# Unlimited-clients management (admin CRUD). Optional; required only for the
# /api/v1/admin/unlimited-clients endpoints and startup reconcile.
#
# File the backend owns and rewrites; it replaces hand-edited no_shaping_ips.
unlimited_clients_path: /var/lib/ala-archa-http-backend/unlimited-clients.yaml
# CIDR an admin may pick unlimited-client IPs from (must have an active lease).
unlimited_subnet: "10.11.5.0/24"
# MAC blacklist (admin CRUD via /api/v1/admin/blacklist). The backend owns and
# rewrites this file; entries are checked in UNION with the static
# `blacklisted_macs` below. Optional (defaults to this path).
blacklist_path: /var/lib/ala-archa-http-backend/blacklist.yaml
# dhcp_reservations: how the backend manages dnsmasq reservations for unlimited
# clients. It owns the hostsfile below (referenced from dnsmasq.conf via
# `dhcp-hostsfile=/etc/ratzek-dnsmasq-hosts`), regenerates it from the store on every
# CRUD change and on startup, validates with `dnsmasq --test`, then reloads dnsmasq
# (SIGHUP). Backend runs as root. Omit to disable reservation management (admin CRUD
# POST then returns 500).
# dhcp_reservations:
#   include_path: /etc/ratzek-dnsmasq-hosts             # absolute; backend owns/rewrites it
#   validate_command: "dnsmasq --test -C /etc/ratzek-dnsmasq.conf"
#   reload_command: "systemctl reload dnsmasq-ratzek"
#   # reload_log: dnsmasq applies a hostsfile SILENTLY on SIGHUP — `dnsmasq --test`
#   # can NOT catch a bad reservation line — so after reload the backend scrapes the
#   # daemon log; a match rolls the hostsfile fully back. Requires `log-dhcp` +
#   # `log-facility=<file>` in dnsmasq.conf.
#   reload_log:
#     file: /var/log/ratzek-dnsmasq.log     # absolute; the dnsmasq log-facility target
#   #   success_contains: "read"            # marks reload completion (default)
#   #   error_contains: "at line"           # a hostsfile line with this = rejected (default)
#   #   timeout_secs: 3                      # bounded scrape poll (default)
#   # active_unit: <unit>                   # optional: skip reload if this unit is down

# device_metrics: optional per-device metrics (first/last seen, accumulated traffic,
# IP history) sampled periodically from dhcpd leases + ipset counters into SQLite and
# surfaced in the admin API (GET /api/v1/admin/devices, and extra fields on
# unlimited-clients). Best-effort: a DB error disables metrics but never blocks the
# backend. Omit to disable. Back up the .sqlite file before upgrades.
# device_metrics:
#   db_path: /var/lib/ala-archa-http-backend/device-metrics.sqlite   # absolute
#   crontab: "0 */5 * * * *"     # 6-field cron; every 5 min (spare SD-card writes)
#   retention_days: 730          # drop daily traffic buckets / IP history older than this
#   retention_hourly_days: 90    # drop hourly traffic buckets older than this (optional)
#   retention_5min_hours: 48     # drop 5-minute traffic buckets older than this (optional)

# history: optional WAN history + event log. Persists periodic speedtest/balance
# readings and notable events (internet up/down, low balance, new device, blacklist
# add/remove, disconnect) into a SQLite DB; surfaced at GET /api/v1/admin/wan/* and
# GET /api/v1/admin/events. Best-effort: a DB error disables it but never blocks the
# backend. Omit to disable (those endpoints then return 404). `new_device` events
# additionally require `device_metrics` to be enabled.
# history:
#   db_path: /var/lib/ala-archa-http-backend/history.sqlite   # absolute
#   retention_days: 90           # drop WAN readings / events older than this

# live_traffic: optional in-memory live-bandwidth sampler. Reads ipset byte counters
# every ~15s and adds `bytes_last_min` (total bytes over the last minute) and
# `rate_bps_live` (current bytes/sec, up+down combined) to each device in
# GET /api/v1/admin/devices — "who is using the channel right now". Sort with
# ?sort=rate_bps_live&order=desc. Data is ephemeral (in memory, lost on restart) and
# never touches disk. Omit the section or set enabled: false to disable (fields then
# read null). Exposes ratzek_live_traffic_{enabled,age_seconds} on /metrics.
# live_traffic:
#   enabled: true                # default true when the section is present
#   crontab: "*/15 * * * * *"    # 6-field cron; every 15s (default)
#   window_secs: 60              # rolling window for bytes_last_min / rate (default)

# shaper_quota_reset: optional per-client byte-quota reset. On the host the "speed
# limit" is an iptables byte quota (`--bytes-gt` -> MARK -> tc); the shaper ipset entry
# is refreshed by every packet, so its counter only resets after ~3h of ZERO traffic —
# a device with background traffic never resets and stays throttled forever. This job
# gives each client a rolling window: `period_secs` after it is first seen in the set
# (and every period after), its counter is reset via `ipset del` (re-created from zero
# by the next packet — no disconnect, throttle clears). The per-IP `window_start` is
# in-memory; the per-IP OWNING-MAC is persisted by a separate job to `owner_state_path`
# so the inheritance (IP hand-over) reset survives process restarts. iptables is NOT
# modified. Omit or set enabled: false to disable.
# Exposes ratzek_shaper_quota_{enabled,age_seconds,resets_total,errors_total,
# mac_change_resets_total,inheritance_resets_total,leases_read_failures_total,
# owner_persist_failures_total,owners_persisted,owner_persist_age_seconds} and
# ratzek_shaper_clients_over_quota.
# shaper_quota_reset:
#   enabled: true                # default true when the section is present
#   crontab: "0 * * * * *"       # 6-field cron; every 60s (default)
#   period_secs: 10800           # per-client window; match the ipset timeout (3h, default)
#   quota_bytes: 1073741824      # mirror of the iptables --bytes-gt threshold (1 GiB, default)
#   # Durable per-IP owning-MAC store (default below). A separate job writes it every ~2min
#   # so the MAC-change/inheritance reset survives restarts. Set to "" to DISABLE persistence
#   # (tracker stays purely in-memory — the kill-switch for a wedged USB-SSD). When set, must
#   # be absolute and distinct from every other backend-owned state file (persistent_state,
#   # unlimited-clients, blacklist, history.db, device-metrics.db).
#   owner_state_path: /var/lib/ala-archa-http-backend/shaper-quota-owners.yaml

# captive_portal: RFC 8908 Captive Portal API. GET /api/v1/captive-portal returns the
# client's captivity state (captive = source-IP not in acl) + this portal URL. Point DHCP
# option 114 (RFC 8910, in dnsmasq) at that endpoint so iOS 14+/Android 11+ open — and
# auto-dismiss — the portal. Defaults work out of the box; override only to change the URL.
# captive_portal:
#   user_portal_url: "http://www.ratzek/"

telegram:
  bot_token: "123456:ABC-asdasdasdasd"
  retry_crontab: "30 */5 * * * *"
  message_timeout: 24h

# alerting: optional Alertmanager→Telegram sink. Alertmanager (on this host) POSTs its
# webhook to POST /alertmanager/webhook; the handler checks the Bearer token, formats the
# alerts, and enqueues them onto the shared Telegram queue (reuses telegram.bot_token above)
# to a dedicated alerts group. Requires the `telegram` section. Omit to disable (the endpoint
# then returns 404). Exposes ratzek_alert_webhook_{received,errors}_total and
# ratzek_telegram_queue_len on /metrics. See src/alertmanager.rs.
# alerting:
#   webhook_token: "<long random secret, 16+ chars>"  # Alertmanager sends it as Bearer
#   telegram_chat_ids:
#     - "-100XXXXXXXXXX"          # dedicated alerts group (negative id)
#   queue_max_size: 1000          # drop oldest queued msgs beyond this (storm backpressure)

mobile_provider:
  update_tariff_command: |
    ssh ratzek-services@10.11.1.1 '/interface lte at-chat lte1 wait=yes input="AT+CUSD=1,\"*255#\",15"'
  # Перед работой, необходимой переключить Ошку в режим английского языка:
  # ssh ratzek-services@10.11.1.1 '/interface lte at-chat lte1 wait=yes input="AT+CUSD=1,\"*177*3#\",15"'
  get_balance_command: |
    ssh ratzek-services@10.11.1.1 '/interface lte at-chat lte1 wait=yes input="AT+CUSD=1,\"*100#\",15"'
  get_balance_crontab: "0 20 13 * * *"
  low_balance_threshold: 1200
  low_download_speed_threshold: 1000000
  min_update_tariff_interval: 1w
  telegram_chat_ids:
    - "123456789"
    - "-100987654321"
  phone_number: '+996 702 457 912'
  get_balance_retry_count: 3
  get_balance_retry_interval: 5s
  restart_lte_command: |
    ssh ratzek-services@10.11.1.1 '/interface disable lte1; delay 10; /interface enable lte1; delay 10'
